name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - run: ./node_modules/.bin/cake build
        env:
          API_MATE_PRODUCTION_DOMAINS: ${{ secrets.API_MATE_PRODUCTION_DOMAINS }}

      - run: cp lib/api_mate.html lib/index.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./lib
          full_commit_message: "build: deploy ${{ github.sha }}"
